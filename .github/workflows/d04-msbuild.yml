name: D04 MSBuild (Windows + VS 2022)

# 驗證 D04 文章「Conan + Visual Studio」那一段。
#
# 注意：windows runner 上同時裝了多個 Visual Studio。第一次跑的時候
# setup-msbuild 抓到的是 VS 18（Conan 偵測成 msvc 195），不是文章宣稱的
# VS 2022 / msvc 194。所以這裡自己用 vswhere 挑版本，而不是靠 detect —
# 這正是文章踩雷提醒第三點講的事情。

on:
  push:
    paths:
      - 'D04/**'
      - 'expected-output.txt'
      - '.github/workflows/d04-msbuild.yml'
  pull_request:
    paths:
      - 'D04/**'
      - 'expected-output.txt'
      - '.github/workflows/d04-msbuild.yml'
  workflow_dispatch:

jobs:
  msbuild:
    name: Windows / VS 2022 v143 / Conan 2.32.0
    runs-on: windows-2025

    env:
      CONAN_HOME: ${{ github.workspace }}\.conan-home

    defaults:
      run:
        shell: pwsh
        working-directory: D04

    steps:
      - uses: actions/checkout@v7

      - name: 挑出 Visual Studio 2022（文章用的版本）
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $all = & $vswhere -all -prerelease -products * -format json | ConvertFrom-Json
          Write-Host "--- runner 上所有的 Visual Studio ---"
          $all | ForEach-Object { "{0,-8} {1,-16} {2}" -f `
            $_.catalog.productLineVersion, $_.installationVersion, $_.installationPath }

          # 文章用的是 VS 2022（17.x），優先挑它
          $inst = $all | Where-Object { $_.installationVersion -like '17.*' } |
                  Sort-Object installationVersion -Descending | Select-Object -First 1
          if ($inst) {
            Write-Host "OK: 找到 VS 2022 -> $($inst.installationPath)"
          } else {
            $inst = $all | Sort-Object installationVersion -Descending | Select-Object -First 1
            Write-Host "::warning::runner 上沒有 VS 2022，改用 $($inst.installationPath)。產品版本與文章不同。"
          }
          $vs = $inst.installationPath

          # compiler.version 要對齊「專案實際用的 toolset」，不是 VS 的產品版本、
          # 也不是 VS 的預設 toolset —— 這正是文章踩雷提醒第三點。
          #
          # hello-conan-msvc.vcxproj 寫死 PlatformToolset=v143，v143 對應 MSVC 14.4x，
          # 也就是 Conan 的 compiler.version=194（文章那份 profile 的值）。
          # 若改用 VS 的預設 toolset（這台 runner 是 14.51）推成 195，Conan 會寫出
          # PlatformToolset=v145，跟 v143 選到的 14.44 打架：
          #   error MSB8052: MSVC Toolset Version '14.44.35207' is not compatible with 'v145'
          $defaultTools = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $installed = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory | Select-Object -ExpandProperty Name
          Write-Host "VS 預設 toolset：$defaultTools"
          Write-Host "已安裝的 toolset：$($installed -join ', ')"

          $toolsVer = $installed | Where-Object { $_ -like '14.4*' } | Sort-Object -Descending | Select-Object -First 1
          if (-not $toolsVer) {
            throw "這台 runner 沒有 v143 對應的 MSVC 14.4x toolset（專案的 PlatformToolset 是 v143），無法重現文章的環境"
          }
          $msvcVer = '194'
          Write-Host "專案 PlatformToolset=v143 -> MSVC $toolsVer -> Conan compiler.version=$msvcVer"

          # Conan 依 compiler.version=194 會去找 VS 17；這台只有 VS 18，
          # 要用 tools.microsoft.msbuild:vs_version 告訴它 IDE 是哪一版，
          # 否則 MSBuildToolchain 會直接報 "VS non-existing installation: Visual Studio 17"。
          $vsMajor = $inst.installationVersion.Split('.')[0]
          if ($vsMajor -notmatch '^\d+$') { throw "取不到 VS 版本號：$($inst.installationVersion)" }
          Write-Host "VS IDE 版本：$vsMajor"

          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { throw "找不到 MSBuild.exe：$msbuild" }
          & $msbuild -version -nologo

          "MSBUILD=$msbuild"   | Add-Content $env:GITHUB_ENV
          "MSVC_VER=$msvcVer"  | Add-Content $env:GITHUB_ENV
          "VS_PATH=$vs"        | Add-Content $env:GITHUB_ENV
          "VC_TOOLS=$toolsVer" | Add-Content $env:GITHUB_ENV
          "VS_MAJOR=$vsMajor"  | Add-Content $env:GITHUB_ENV

      - name: 安裝 Conan 2.32.0
        run: |
          python -m venv "$env:RUNNER_TEMP\conan"
          & "$env:RUNNER_TEMP\conan\Scripts\python.exe" -m pip install --quiet --upgrade pip
          & "$env:RUNNER_TEMP\conan\Scripts\pip.exe" install --quiet "conan==2.32.0"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\conan\Scripts"

      - name: 寫出文章那份 profile
        run: |
          conan --version
          if ((conan --version) -notmatch '2\.32\.0') { throw "Conan 版本不是 2.32.0" }

          # 不用 conan profile detect：它會挑 runner 上最新的 VS。
          # 這裡直接寫出文章 D04 裡那份 profile，只有 compiler.version 依實際挑到的 VS 決定。
          conan profile detect --force | Out-Null
          $profile = @"
          [settings]
          arch=x86_64
          build_type=Release
          compiler=msvc
          compiler.cppstd=14
          compiler.runtime=dynamic
          compiler.version=$env:MSVC_VER
          os=Windows

          [conf]
          tools.microsoft.msbuild:vs_version=$env:VS_MAJOR
          "@
          $dir = Join-Path $env:CONAN_HOME 'profiles'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'default') -Value $profile -Encoding utf8
          Write-Host "--- 使用的 profile ---"
          conan profile show

      - name: conan install（只裝 Release，故意不裝 Debug）
        run: conan install . --build=missing -s build_type=Release

      - name: 檢查 vs_layout 把檔案收進 conan/
        run: |
          Write-Host "--- conan/ ---"
          Get-ChildItem conan | Select-Object -ExpandProperty Name
          if (-not (Test-Path conan/conandeps.props))      { throw "缺少 conandeps.props" }
          if (-not (Test-Path conan/conantoolchain.props)) { throw "缺少 conantoolchain.props" }
          # 文章說 vs_layout 讓專案根目錄保持乾淨，這裡確認沒有散落的 .props
          $stray = Get-ChildItem -File -Filter *.props | Select-Object -ExpandProperty Name
          if ($stray) { throw "專案根目錄出現 .props：$stray" }
          Write-Host "OK: vs_layout 生效，根目錄沒有散落的 .props"

      - name: 反例：只裝了 Release 就編 Debug 必須失敗
        run: |
          # 文章踩雷提醒第一點：只跑了 Release 的 conan install 就切到 Debug 編譯會失敗。
          & $env:MSBUILD hello-conan-msvc.sln /p:Configuration=Debug /p:Platform=x64 /nologo `
            > "$env:RUNNER_TEMP\neg.log" 2>&1
          $rc = $LASTEXITCODE
          Write-Host "--- msbuild 輸出（尾 30 行）---"
          Get-Content "$env:RUNNER_TEMP\neg.log" -Tail 30

          if ($rc -eq 0) {
            Write-Host "::error::只裝 Release 卻把 Debug 編過了 —— 文章踩雷提醒第一點要重新確認"
            exit 1
          }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\neg.log" -Pattern 'C1083' -Quiet)) {
            Write-Host "::error::失敗了，但不是預期的找不到標頭檔（C1083），請重新確認"
            exit 1
          }
          Write-Host "OK: 如文章所述失敗在找不到標頭檔（exit $rc）"
          exit 0   # msbuild 留下的 $LASTEXITCODE 會被當成整步的結果，這裡要覆寫

      - name: conan install（補上 Debug）
        run: conan install . --build=missing -s build_type=Debug

      - name: Debug 編譯並執行
        run: |
          & $env:MSBUILD hello-conan-msvc.sln /p:Configuration=Debug /p:Platform=x64 /nologo
          if ($LASTEXITCODE -ne 0) { throw "Debug 建置失敗" }
          $actual = (& .\x64\Debug\hello-conan-msvc.exe | Out-String).Replace("`r`n","`n").Trim()
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\expected-output.txt" -Raw).Replace("`r`n","`n").Trim()
          Write-Host $actual
          if ($actual -ne $expected) { throw "Debug 輸出與文章不一致" }
          Write-Host "OK: Debug 輸出與文章一致"

      - name: Release 編譯並執行
        run: |
          & $env:MSBUILD hello-conan-msvc.sln /p:Configuration=Release /p:Platform=x64 /nologo
          if ($LASTEXITCODE -ne 0) { throw "Release 建置失敗" }
          $actual = (& .\x64\Release\hello-conan-msvc.exe | Out-String).Replace("`r`n","`n").Trim()
          $expected = (Get-Content "$env:GITHUB_WORKSPACE\expected-output.txt" -Raw).Replace("`r`n","`n").Trim()
          Write-Host $actual
          if ($actual -ne $expected) { throw "Release 輸出與文章不一致" }
          Write-Host "OK: Release 輸出與文章一致"

      - name: 摘要
        if: always()
        run: |
          @(
            "## D04 MSBuild 驗證"
            ""
            "| 項目 | 值 |"
            "|---|---|"
            "| Visual Studio | $env:VS_PATH |"
            "| MSVC toolset | $env:VC_TOOLS |"
            "| Conan compiler.version | $env:MSVC_VER |"
            "| Conan | $((conan --version) -replace 'Conan version ','') |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
